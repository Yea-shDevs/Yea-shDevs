        <circle cx="5" cy="-4" r="4.5" fill="#ff5fa2"/>
        <text x="16" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9aa4d6">Public Repos</text>
        <text x="246" y="0" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#ff5fa2">6</text>
      </g>
    </g>
<g transform="translate(210,118)">
      <g opacity="0">
        <animate attributeName="opacity" keyTimes="0.0000;0.4318;1.0000" values="0;0;1" dur="0.88s" begin="0s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4318;1.0000" values="24,0;24,0;0,0" dur="0.88s" begin="0s" fill="freeze"/>
        <circle cx="5" cy="-4" r="4.5" fill="#9b6bff"/>
        <text x="16" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9aa4d6">LeetCode Solved</text>
        <text x="246" y="0" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#9b6bff">3</text>
