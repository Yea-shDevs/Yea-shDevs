        <circle cx="5" cy="-4" r="4.5" fill="#ffb020"/>
        <text x="16" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9aa4d6">Profile Rank</text>
        <text x="246" y="0" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#ffb020">B+</text>
