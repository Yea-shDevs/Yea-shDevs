<g transform="translate(210,158)">
      <g opacity="0">
        <animate attributeName="opacity" keyTimes="0.0000;0.5283;1.0000" values="0;0;1" dur="1.06s" begin="0s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5283;1.0000" values="24,0;24,0;0,0" dur="1.06s" begin="0s" fill="freeze"/>
        <circle cx="5" cy="-4" r="4.5" fill="#22d3ee"/>
        <text x="16" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#9aa4d6">Languages Used</text>
        <text x="246" y="0" text-anchor="end" font-family="'SFMono-Regular',Consolas,monospace" font-size="15" font-weight="700" fill="#22d3ee">3</text>
